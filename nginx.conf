worker_processes auto;

events { worker_connections 1024; }

http {
  # Не раскрываем версию nginx (tech headers)
  server_tokens off;

  upstream api {
    server localhost:8081;
  }

  include /etc/nginx/mime.types;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # ==========================================================================
    # OWASP baseline security headers — Client Portal (Личный кабинет)
    # https://owasp.org/www-project-secure-headers/
    # ЛК: не индексируется, не встраивается во frame, не кешируется,
    # не отдаёт referrer, работает только по HTTPS.
    # ==========================================================================

    # Только HTTPS — HSTS (браузеры применяют его при TLS-терминации).
    # Внимание: текущий сервер слушает порт 80; HSTS заработает, когда впереди
    # (или здесь) появится HTTPS — добавьте 443 server/редирект с 80 на 443.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Запрет MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Не отдавать referrer-данные (исключения возможны для SSO / dxFINA)
    add_header Referrer-Policy "no-referrer" always;

    # ЛК не индексируется поисковиками
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Защита от clickjacking
    add_header X-Frame-Options "DENY" always;

    # CSP: пока принудительно только frame-ancestors 'none' (безопасно и не ломает фронт),
    # полная политика тестируется в режиме Report-Only (см. ниже)
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    # Запрет browser permissions до появления интерактива в ЛК
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Кэш по умолчанию: НЕ кэшировать (HTML, API, PDF, персональные данные).
    # Статические assets переопределяют $cache_control в своих location.
    set $cache_control "no-store, no-cache, must-revalidate, private";
    add_header Cache-Control $cache_control always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # CSP в режиме Report-Only: сначала собираем реальные источники
    # (inline-скрипты, CDN, WebSocket, vendor SDK, динамические assets),
    # затем включаем строгую политику ниже.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://sso.rioni-capital.ge; report-uri /csp-report;" always;

    # ==========================================================================
    # Строгая CSP — включать ПОСЛЕ анализа отчётов Report-Only:
    # add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://sso.rioni-capital.ge; frame-src 'none'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" always;
    #
    # Перед включением строгой CSP проверьте:
    #  1. PDF-preview использует <iframe src="blob:..."> (src/components/BaseComponents/TopUpForm.vue)
    #     -> потребуется frame-src 'self' blob: (либо заменить iframe на download).
    #  2. Продовый API: VITE_API_BASE_URL=http://51.250.101.25:8081/api (.env.production) —
    #     кросс-ориджин вызовы нужно добавить в connect-src (или проксировать /api/ через nginx
    #     same-origin, как в dev-конфигурации).
    #  3. upgrade-insecure-requests форсирует https для всех подресурсов — сервер должен отдавать
    #     контент по HTTPS, иначе фронт сломается.
    # ==========================================================================

    # Приём CSP-отчётов Report-Only. Заглушка-коллектор (204);
    # при необходимости замените на реальный endpoint сбора отчётов.
    location = /csp-report {
      access_log off;
      default_type application/csp-report;
      return 204;
    }

    # --------------------------------------------------------------------------
    # API — ответы с данными клиента, PDF/отчёты: не кэшировать
    # --------------------------------------------------------------------------
    location /api/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin';
        add_header 'Access-Control-Max-Age' 86400;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

      # ВАЖНО: location объявляет собственные add_header, поэтому server-level
      # заголовки сюда НЕ наследуются — дублируем нужные вручную.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;

      proxy_pass         http://api;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Изображения клиента (фото, документы) — кешировать НЕЛЬЗЯ:
    # наследуют server-level Cache-Control no-store
    # --------------------------------------------------------------------------
    location /images/ {
      proxy_pass         http://localhost:8081;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Статические assets — можно кешировать (хэшированные файлы сборки Vite)
    # --------------------------------------------------------------------------
    location /assets/ {
      set $cache_control "public, max-age=2592000, immutable";
    }

    # Статические изображения приложения (иконки соцсетей и т.п.)
    location /img/ {
      set $cache_control "public, max-age=2592000, immutable";
    }

    # Flag icons
    location /node_modules/flag-icons/ {
      alias /usr/share/nginx/html/assets/flag-icons/;
      set $cache_control "public, max-age=2592000, immutable";
    }

    location /flags/ {
      alias /usr/share/nginx/html/flags/;
      set $cache_control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # SPA — HTML-страницы: наследуют server-level headers (no-store + CSP)
    # --------------------------------------------------------------------------
    location / {
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;

      auth_basic "Restricted";
      auth_basic_user_file  /etc/nginx/.htpasswd;
    }
  }
}
